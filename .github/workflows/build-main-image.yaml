name: Build main image

on:
  push:
    branches: [main]
    paths:
      - backend/**
      - frontend/**
      - infra/**
      - Dockerfile
      - docker/**
      - scripts/deploy-server.sh
      - .github/workflows/deploy-staging.yaml
      - .github/workflows/build-main-image.yaml

permissions:
  contents: read

concurrency:
  group: build-main-image
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  IMAGE: ghcr.io/itskeks/verwalino

jobs:
  main:
    name: Publish and sign main image without a release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout main revision
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push main image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:sha-${{ github.sha }}
          provenance: mode=max
          sbom: true
      - name: Install cosign
        uses: sigstore/cosign-installer@v4.1.2
      - name: Sign image digest with GitHub OIDC
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"
