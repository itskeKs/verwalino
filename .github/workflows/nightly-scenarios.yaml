name: Nightly scenarios

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      file_issues:
        description: File scenario failures as issues
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  scenarios:
    name: Scenarios (${{ matrix.mode }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    concurrency:
      group: scenario-issues-${{ github.repository }}
      cancel-in-progress: false
    timeout-minutes: 45
    # The legs share the issue-filing concurrency group above, so they run one after the other.
    strategy:
      fail-fast: false
      matrix:
        # selfhost runs against the installer's stack. The portable installer is selfhost-only
        # (DEPLOY.md), so hosted runs the same features on the local stack in hosted mode.
        mode: [selfhost, hosted]
    # Both legs start Mailpit; only the hosted leg's mail scenarios (signup, quotas, recovery) read it.
    services:
      mailpit:
        image: axllent/mailpit:v1.32.0@sha256:0790692be935ea4420d085694f7985b1f692ca6a8771ab0e0bd8ba75ac180498
        ports:
          - 1025:1025
          - 8025:8025
        options: >-
          --health-cmd="/mailpit readyz"
          --health-interval=2s --health-timeout=2s --health-retries=15
    env:
      UV_LOCKED: "1"
      HV_DEPLOYMENT_MODE: ${{ matrix.mode }}
      VERWALINO_TARGET_URL: http://127.0.0.1:18080
      VERWALINO_TARGET_ADMIN_EMAIL: nightly@example.test
      VERWALINO_TARGET_RETENTION_EMAIL: nightly-retention@example.test
      VERWALINO_TARGET_RETENTION_ANNA_EMAIL: nightly-retention-anna@example.test
      VERWALINO_TARGET_RETENTION_EVA_EMAIL: nightly-retention-eva@example.test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Prepare report
        run: |
          mkdir -p report
          printf 'SCENARIO_DATE=%s\n' "$(date -u +%F)" >> "$GITHUB_ENV"

      - name: Prepare disposable credentials
        if: ${{ matrix.mode == 'selfhost' }}
        run: |
          : > "$RUNNER_TEMP/scenario-selfhost.log"
          password=$(openssl rand -hex 24)
          printf '::add-mask::%s\n' "$password"
          printf 'VERWALINO_TARGET_ADMIN_PASSWORD=%s\n' "$password" >> "$GITHUB_ENV"
          for fixture in RETENTION RETENTION_ANNA RETENTION_EVA; do
            retention_password=$(openssl rand -hex 24)
            printf '::add-mask::%s\n' "$retention_password"
            printf 'VERWALINO_TARGET_%s_PASSWORD=%s\n' "$fixture" "$retention_password" >> "$GITHUB_ENV"
          done

      - name: Initialize and start self-host installation
        if: ${{ matrix.mode == 'selfhost' }}
        run: |
          # start builds the checkout image and owns project verwalino.
          bash scripts/self-host.sh init --port 18080 2>&1 | tee -a "$RUNNER_TEMP/scenario-selfhost.log"
          bash scripts/self-host.sh start 2>&1 |
            sed -E 's/^(Setup token: ).*/\1[redacted]/' |
            tee -a "$RUNNER_TEMP/scenario-selfhost.log"

          # Use the reviewed CLI alternative after start issues a browser setup token.
          printf '%s\n' "$VERWALINO_TARGET_ADMIN_PASSWORD" |
            bash scripts/self-host.sh admin --org "Verwaltung Alpha" \
              --email "$VERWALINO_TARGET_ADMIN_EMAIL" --password-stdin 2>&1 |
            tee -a "$RUNNER_TEMP/scenario-selfhost.log"
          # Isolate the supplier's retention maximum and each privacy archive.
          # Each fixture consumes only its corresponding disposable admin.
          for fixture in RETENTION RETENTION_ANNA RETENTION_EVA; do
            email_key="VERWALINO_TARGET_${fixture}_EMAIL"
            password_key="VERWALINO_TARGET_${fixture}_PASSWORD"
            printf '%s\n' "${!password_key}" |
              bash scripts/self-host.sh admin --org "Aufbewahrungsprüfung $fixture" \
                --email "${!email_key}" --password-stdin 2>&1 |
              tee -a "$RUNNER_TEMP/scenario-selfhost.log"
          done

      - name: Wait for application readiness
        if: ${{ matrix.mode == 'selfhost' }}
        run: curl --fail --silent --show-error --retry 30 --retry-delay 2 --retry-connrefused http://127.0.0.1:18080/api/health/ready

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.7"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install scenario dependencies and Chromium
        working-directory: backend
        run: |
          uv sync --locked --extra dev --extra ops --extra ocr
          uv run --locked --extra dev playwright install --with-deps chromium
          sudo apt-get install -y --no-install-recommends libpangoft2-1.0-0 fonts-dejavu-core poppler-utils
          pdftotext -v

      # Hosted leg: the PR workflow's backend environment (in-process app, Postgres and Mailpit).
      - name: Install local-stack system libraries
        if: ${{ matrix.mode == 'hosted' }}
        run: >-
          sudo apt-get update && sudo apt-get install -y --no-install-recommends
          libpango-1.0-0 libpangocairo-1.0-0 libpangoft2-1.0-0 libcairo2
          libgdk-pixbuf-2.0-0 libffi8 fonts-dejavu-core shared-mime-info
          poppler-utils qpdf tesseract-ocr tesseract-ocr-deu

      - name: Start test database
        if: ${{ matrix.mode == 'hosted' }}
        run: docker compose -f infra/docker-compose.declaration-test.yml up -d --wait postgres

      - name: Run all API and browser features against the installation
        if: ${{ matrix.mode == 'selfhost' }}
        working-directory: backend
        run: |
          uv run --locked --extra dev --extra ops --extra ocr pytest tests/bdd --run-browser -q --scenario-report ../report

      # The target owns the database lock, runs hosted policy and unsets the external target URL
      # and admin login set above. Browser features stay in the selfhost leg: the browser
      # stack's app does not start in hosted mode yet (#537).
      - name: Run the API features in hosted mode on the local stack
        if: ${{ matrix.mode == 'hosted' }}
        run: make test-bdd-hosted PYTEST_ARGS="-q --scenario-report ../report"

      - name: Stop self-host installation
        if: ${{ always() && matrix.mode == 'selfhost' }}
        run: |
          if [[ -f .env.selfhost ]]; then
            bash scripts/self-host.sh stop 2>&1 | tee -a "$RUNNER_TEMP/scenario-selfhost.log"
          fi

      - name: Collect bounded scenario logs
        if: ${{ always() && matrix.mode == 'selfhost' }}
        run: |
          mkdir -p report/logs
          cp "$RUNNER_TEMP/scenario-selfhost.log" report/logs/selfhost.log
          # Keep the backend log's last 2 MiB; browser traces already keep failures only.
          docker logs verwalino-app-1 2>&1 | tail -c 2097152 > report/logs/backend.log

      - name: Publish scenario summary
        if: always()
        run: |
          if [[ ! -f report/summary.md ]]; then
            mkdir -p report
            printf 'Scenario execution did not produce a report; see job logs and the artifact.\n' > report/summary.md
          fi
          cat report/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Retain scenario history
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: scenarios-${{ matrix.mode }}-${{ env.SCENARIO_DATE }}
          path: report/
          retention-days: 90

      - name: File scenario failure issues
        if: ${{ always() && (github.event_name != 'workflow_dispatch' || inputs.file_issues == true) }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ -f report/scenarios.json ]]; then
            python3 scripts/scenario_issues.py --report report/scenarios.json \
              --repo "${{ github.repository }}" \
              --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
              --mode "${{ matrix.mode }}"
          else
            echo "Scenario execution did not produce scenarios.json; no failures to file."
          fi
