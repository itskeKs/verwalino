name: Release image

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing vX.Y.Z tag to publish; select the same workflow ref"
        required: true
        type: string

permissions:
  contents: read
  packages: write
  id-token: write

# Finish publishing and signing one release before starting another.
concurrency:
  group: release-image
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  IMAGE: ghcr.io/itskeks/verwalino

jobs:
  release:
    name: Publish and sign amd64 + arm64
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Validate release tag
        id: release
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo '::error::Use a stable release tag vX.Y.Z (no leading zeroes).'
            exit 1
          fi
          if [[ "$GITHUB_REF" != "refs/tags/$RELEASE_TAG" ]]; then
            echo '::error::Select the same release tag as the workflow ref and tag input.'
            exit 1
          fi
          printf 'tag=%s\n' "$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          printf 'minor_tag=%s\n' "${RELEASE_TAG%.*}" >> "$GITHUB_OUTPUT"

      - name: Checkout release tag
        uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ steps.release.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Require release commit on main
        run: |
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo '::error::Release tags must point to a commit reachable from origin/main.'
            exit 1
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          context: git
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=${{ steps.release.outputs.tag }}
            type=raw,value=${{ steps.release.outputs.minor_tag }}

      - name: Build and push both platforms
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true

      # BuildKit attaches provenance and SBOMs; sign their enclosing image index.
      # A second provenance producer is unnecessary for this release path.
      - name: Install cosign
        uses: sigstore/cosign-installer@v4

      - name: Sign image digest with GitHub OIDC
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"

      - name: Summarize published image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          {
            printf '### Published %s\n\n' "$RELEASE_TAG"
            printf '`%s@%s`\n\n' "$IMAGE" "$DIGEST"
            printf 'Platforms: `linux/amd64`, `linux/arm64`.\n\n'
            printf 'BuildKit provenance (`mode=max`), SBOMs and a cosign keyless signature are attached.\n'
          } >> "$GITHUB_STEP_SUMMARY"

  installer:
    name: Sign and publish installer bundle
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ needs.release.outputs.tag }}
          persist-credentials: false

      - name: Assemble release assets and checksums
        id: bundle
        env:
          DIGEST: ${{ needs.release.outputs.digest }}
        run: |
          [[ "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          mkdir release-assets
          cp install.sh scripts/self-host.sh infra/docker-compose.yml infra/Caddyfile infra/db/prod-init.sh release-assets/
          cp .env.example release-assets/env.example
          printf '%s\n' "$DIGEST" > release-assets/IMAGE_DIGEST
          cd release-assets
          sha256sum install.sh self-host.sh docker-compose.yml Caddyfile prod-init.sh env.example IMAGE_DIGEST > SHA256SUMS

      - name: Install cosign
        uses: sigstore/cosign-installer@v4

      - name: Sign checksums with GitHub OIDC
        run: cosign sign-blob --yes --bundle release-assets/SHA256SUMS.sigstore.json release-assets/SHA256SUMS

      - name: Publish GitHub Release and installer assets
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.release.outputs.tag }}
          name: Verwalino ${{ needs.release.outputs.tag }}
          draft: false
          prerelease: false
          make_latest: legacy
          fail_on_unmatched_files: true
          files: release-assets/*
          body: |
            Image (multi-platform index, linux/amd64 and linux/arm64):
            `${{ env.IMAGE }}@${{ needs.release.outputs.digest }}`

            The installer assets are covered by SHA256SUMS, signed keylessly in
            SHA256SUMS.sigstore.json by this tag's release-image.yaml workflow.
            See DEPLOY.md at this tag for installation and manual verification.
