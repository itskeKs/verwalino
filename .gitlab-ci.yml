# All CI container inputs are manifest-list digests. Image release and smoke
# jobs share the same default-branch/tag eligibility; the optional host deploy
# uses a separately prepared, versioned source-release workflow.

stages:
  - test
  - audit
  - build
  - scan
  - smoke
  - deploy

.release-rules: &release-rules
  - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  - if: '$CI_COMMIT_TAG'

backend-test:
  stage: test
  image: python:3.12-slim-bookworm@sha256:0f5b26b9518d002b6173fd61daad821fa340635ebfec5bba471013f9ca114579
  services:
    - name: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
      alias: postgres
  variables:
    POSTGRES_DB: hausverwaltung
    POSTGRES_USER: app_migrator
    POSTGRES_PASSWORD: migrator_secret
    HV_DATABASE_URL: "postgresql+asyncpg://app_rw:app_secret@postgres:5432/hausverwaltung"
    HV_DATABASE_URL_MIGRATOR: "postgresql+asyncpg://app_migrator:migrator_secret@postgres:5432/hausverwaltung"
    HV_DATABASE_URL_SYNC: "postgresql://app_migrator:migrator_secret@postgres:5432/hausverwaltung"
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends postgresql-client libpango-1.0-0 libpangocairo-1.0-0 libpangoft2-1.0-0 libcairo2 libgdk-pixbuf-2.0-0 libffi8 fonts-dejavu-core shared-mime-info
    - python -m pip install --no-cache-dir uv==0.11.7
    - export PGPASSWORD=migrator_secret
    - until pg_isready -h postgres -U app_migrator -d hausverwaltung; do sleep 1; done
    - psql -h postgres -U app_migrator -d hausverwaltung -c "CREATE ROLE app_rw LOGIN PASSWORD 'app_secret' NOBYPASSRLS NOCREATEDB NOCREATEROLE; GRANT CONNECT ON DATABASE hausverwaltung TO app_rw;"
  script:
    - cd backend && uv sync --locked --extra dev --extra ops && uv run pytest -q

frontend-test:
  stage: test
  image: node:22-bookworm-slim@sha256:83f487e0a63425e5b4d146fb5e5be574bcbe1b7b843d3ebafdd95eaf7767a7e5
  script:
    - cd frontend && npm ci && npm run lint && npm test && npm run build && npm audit --omit=dev

backend-audit:
  stage: audit
  image: python:3.12-slim-bookworm@sha256:0f5b26b9518d002b6173fd61daad821fa340635ebfec5bba471013f9ca114579
  before_script:
    - python -m pip install --no-cache-dir uv==0.11.7
  script:
    - cd backend && uv lock --check && uv export --locked --no-dev --extra ops --format requirements-txt --output-file /tmp/runtime-requirements.txt && uvx --from pip-audit pip-audit --requirement /tmp/runtime-requirements.txt

build-image:
  stage: build
  image: docker:27.5.1-cli@sha256:851f91d241214e7c6db86513b270d58776379aacc5eb9c4a87e5b47115e3065c
  # Requires a GitLab Runner configured with privileged=true. TLS is disabled
  # only for this ephemeral job/service network; it is never used for deploy.
  services:
    - name: docker:27.5.1-dind@sha256:aa3df78ecf320f5fafdce71c659f1629e96e9de0968305fe1de670e0ca9176ce
      alias: docker
      command: ["--tls=false"]
  variables:
    DOCKER_HOST: "tcp://docker:2375"
    DOCKER_TLS_CERTDIR: ""
  rules: *release-rules
  script:
    - printf '%s:%s' "$CI_REGISTRY_USER" "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" --username "$CI_REGISTRY_USER" --password-stdin
    - export IMAGE_TAG="$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA"
    - docker build --pull --tag "$IMAGE_TAG" .
    - docker push "$IMAGE_TAG"
    - export IMAGE_DIGEST="$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE_TAG")"
    - test -n "$IMAGE_DIGEST"
    - printf 'APP_IMAGE=%s\n' "$IMAGE_DIGEST" > image.env
  artifacts:
    reports:
      dotenv: image.env

scan-image:
  stage: scan
  image:
    name: aquasec/trivy:0.69.0@sha256:33f816d414b9d582d25bb737ffa4a632ae34e222f7ec1b50252cef0ce2266006
    entrypoint: [""]
  rules: *release-rules
  needs:
    - job: build-image
      artifacts: true
  variables:
    TRIVY_USERNAME: "$CI_REGISTRY_USER"
    TRIVY_PASSWORD: "$CI_REGISTRY_PASSWORD"
  script:
    - trivy image --scanners vuln --format cyclonedx --output sbom.cdx.json "$APP_IMAGE"
    - chmod 600 sbom.cdx.json && test "$(stat -c '%a' sbom.cdx.json)" = 600
    - trivy image --scanners vuln --ignore-unfixed --severity HIGH,CRITICAL --exit-code 1 "$APP_IMAGE"
  artifacts:
    paths:
      - sbom.cdx.json

container-smoke:
  stage: smoke
  image: docker:27.5.1-cli@sha256:851f91d241214e7c6db86513b270d58776379aacc5eb9c4a87e5b47115e3065c
  # Requires a GitLab Runner configured with privileged=true. TLS is disabled
  # only for this ephemeral job/service network; it is never used for deploy.
  services:
    - name: docker:27.5.1-dind@sha256:aa3df78ecf320f5fafdce71c659f1629e96e9de0968305fe1de670e0ca9176ce
      alias: docker
      command: ["--tls=false"]
  variables:
    DOCKER_HOST: "tcp://docker:2375"
    DOCKER_TLS_CERTDIR: ""
  rules: *release-rules
  needs:
    - job: build-image
      artifacts: true
    - job: scan-image
  script:
    - printf '%s:%s' "$CI_REGISTRY_USER" "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" --username "$CI_REGISTRY_USER" --password-stdin
    - docker pull "$APP_IMAGE"
    - docker network create traefik
    - export MIGRATOR_PASSWORD=0123456789abcdef APP_RW_PASSWORD=fedcba9876543210 SESSION_SECRET=0123456789abcdef0123456789abcdef HV_VERIFY_COMPOSE_FILE=docker-compose.prod.yml
    - chmod 0555 scripts/verify-production.sh && scripts/verify-production.sh

# This is optional future automation, not the initial Moon deployment. It uses
# protected/masked admin smoke credential only through SSH stdin, and invokes the
# same host-built Trivy/SBOM/public-smoke gate as the documented manual path.
deploy-production:
  stage: deploy
  image: alpine:3.20@sha256:d9e853e87e55526f6b2917df91a2115c36dd7c696a35be12163d44e6e2a4b6bc
  needs:
    - job: build-image
      artifacts: true
    - job: scan-image
    - job: container-smoke
  rules:
    - if: '$HV_ENABLE_CI_DEPLOY == "true" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: manual
  environment:
    name: production
  before_script:
    - apk add --no-cache openssh-client
    - eval "$(ssh-agent -s)"
    - printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p /root/.ssh && chmod 700 /root/.ssh
    - printf '%s\n' "$SSH_KNOWN_HOSTS" > /root/.ssh/known_hosts && chmod 600 /root/.ssh/known_hosts
  script:
    - |
      set -eu
      : "${HV_SMOKE_ADMIN_PASSWORD:?configure a protected masked admin smoke password}"
      RELEASE_ID="$CI_COMMIT_SHA"
      DEPLOY_ROOT=/home/chris/apps/hausverwaltung-alpha
      archive="$(mktemp /tmp/hausverwaltung-alpha.XXXXXX)"
      trap 'rm -f "$archive"' EXIT
      tar --exclude=.git --exclude=.claude --exclude='.claude/**' \
        --exclude='.DS_Store' --exclude='*/.DS_Store' \
        --exclude='._*' --exclude='*/._*' \
        --exclude=.env --exclude='.env.*' \
        --exclude='*/.env' --exclude='*/.env.*' \
        --exclude='backend/.venv' --exclude='backend/.venv/**' \
        --exclude='.hypothesis' --exclude='.hypothesis/**' \
        --exclude='backend/.hypothesis' --exclude='backend/.hypothesis/**' \
        --exclude='backend/*.egg-info' --exclude='backend/*.egg-info/**' \
        --exclude='frontend/node_modules' --exclude='frontend/node_modules/**' \
        --exclude='frontend/dist' --exclude='frontend/dist/**' \
        --exclude='**/.pytest_cache' --exclude='**/.pytest_cache/**' \
        --exclude='**/__pycache__' --exclude='**/__pycache__/**' \
        --exclude='image.env' --exclude='sbom.cdx.json' \
        -czf "$archive" .
      ssh "$DEPLOY_USER@$DEPLOY_HOST" "
        set -eu
        root='$DEPLOY_ROOT'
        install -d -m 700 \"\$root\" \"\$root/releases\" \"\$root/shared\"
        test -f \"\$root/shared/.env\"
        test \"\$(stat -c '%a' \"\$root/shared/.env\")\" = 600
        test \"\$(docker network inspect traefik --format '{{(index .IPAM.Config 0).Subnet}}')\" = 172.21.0.0/16
        test ! -e \"\$root/releases/$RELEASE_ID\"
        test ! -e \"\$root/releases/$RELEASE_ID.tar.gz\"
      "
      scp "$archive" "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_ROOT/releases/$RELEASE_ID.tar.gz"
      printf '%s\n' "$HV_SMOKE_ADMIN_PASSWORD" | \
        ssh "$DEPLOY_USER@$DEPLOY_HOST" "
          set -eu
          root='$DEPLOY_ROOT'
          release=\"\$root/releases/$RELEASE_ID\"
          archive=\"\$root/releases/$RELEASE_ID.tar.gz\"
          install -d -m 700 \"\$release\"
          tar -xzf \"\$archive\" -C \"\$release\"
          rm -f \"\$archive\"
          DEPLOY_ROOT=\"\$root\" RELEASE_ID='$RELEASE_ID' sh \"\$release/scripts/deploy-production.sh\"
        "
