[project]
name = "hausverwaltung-backend"
version = "0.1.0"
description = "Backend for Hausverwaltungssoftware MVP"
license = "AGPL-3.0-only"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "sqlalchemy[asyncio]>=2.0,<3",
    "asyncpg>=0.30,<1",
    "alembic>=1.14,<2",
    "argon2-cffi>=23,<25",
    "pydantic>=2.0,<3",
    "pydantic-settings>=2.0,<3",
    "itsdangerous>=2.2,<3",
    "jinja2>=3.1,<4",
    "python-multipart>=0.0.18",
    "weasyprint>=70,<71",
    "pdfplumber>=0.11,<1",
    "lxml>=5,<7",
    "openai>=3,<4",
    "tiktoken>=0.9,<1",
    "sentry-sdk[fastapi]>=2.73,<3",
]

[project.optional-dependencies]
ops = [
    "psycopg2-binary>=2.9,<3",
]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.25,<1",
    "httpx>=0.28,<1",
    "reportlab>=4.0,<5",
    # M3: property-based testing of the distribution engine invariants
    # (architecture.md section 6, m3-abrechnungs-engine.md section 9.2).
    "hypothesis>=6,<7",
    "ruff>=0.8,<1",
    "pytest-bdd>=8,<9",
    "pytest-playwright>=0.7,<1",
]
ocr = [
    "pytesseract>=0.3,<1",
    "pdf2image>=1.17,<2",
    "pikepdf>=9,<12",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "browser: browser journeys (opt in with --run-browser)",
    "selfhost: scenario requires the self-hosted deployment policy",
    "hosted: scenario requires the hosted deployment policy",
]

[tool.ruff]
# Gate introduced with the dev workflow (Makefile `lint`, scripts/checks.sh, CI).
# Only the bug-finding rules that are clean on today's code are enforced, so the
# gate is green from day one; `ruff format` is deliberately NOT part of it.
# The pinned ruff (uv.lock) also defines the default rule set, so `select` is
# explicit instead of relying on defaults that change between ruff versions.
target-version = "py312"

[tool.ruff.lint]
select = [
    "E9",   # syntax errors / unreadable files
    "F5",   # str.format / %-format mistakes
    "F6",   # invalid comparisons, dict keys, assert on tuples
    "F7",   # misplaced break/continue/return/yield/await
    "F82",  # undefined names (F821/F822/F823)
    "PLE",  # pylint errors (e.g. invalid __all__, bad format strings)
    "B006", # mutable default arguments
    "B011", # assert False
    "B012", # return/break/continue inside finally
    "B015", # pointless comparison
    "B018", # useless expression
    "B025", # duplicate except handlers
    "T10",  # leftover debugger statements
]
# Candidates to enable later, one at a time, each with its own cleanup commit
# (counts on the code base at introduction, ruff 0.17):
#   F401 unused import (168), F841 unused variable (14), F811 redefined-while-unused
#   (1150, mostly pytest fixture re-imports in tests/), I001 import order (1013),
#   B904 raise-without-from (19), B905 zip-strict (15), B007/B017/B023 (9/8/5),
#   E402 import not at top (44), E741 ambiguous name (20), E701/E702 (721/993),
#   UP pyupgrade (295), PLW1510 subprocess check= (3).
# Not planned: E501, S101, PLR2004, PLC0415, B008 (FastAPI Depends() defaults).

[tool.setuptools.package-data]
app = ["resources/sepa/*.xsd", "mail/templates/de/*.html", "mail/templates/de/*.txt", "mail/templates/de/*.jinja"]
