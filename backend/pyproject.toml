[project]
name = "hausverwaltung-backend"
version = "0.1.0"
description = "Backend for Hausverwaltungssoftware MVP"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "sqlalchemy[asyncio]>=2.0,<3",
    "asyncpg>=0.30,<1",
    "alembic>=1.14,<2",
    "argon2-cffi>=23,<25",
    "pydantic>=2.0,<3",
    "pydantic-settings>=2.0,<3",
    "itsdangerous>=2.2,<3",
    "python-multipart>=0.0.18",
    "weasyprint>=69,<70",
    "pdfplumber>=0.11,<1",
    "openai>=3,<4",
    "tiktoken>=0.9,<1",
]

[project.optional-dependencies]
ops = [
    "psycopg2-binary>=2.9,<3",
]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.25,<1",
    "httpx>=0.28,<1",
    "reportlab>=4.0,<5",
    # M3: property-based testing of the distribution engine invariants
    # (architecture.md section 6, m3-abrechnungs-engine.md section 9.2).
    "hypothesis>=6,<7",
]
ocr = [
    "pytesseract>=0.3,<1",
    "pdf2image>=1.17,<2",
    "pikepdf>=9,<12",
]

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
