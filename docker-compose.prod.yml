# Single-host production deployment: the app image + PostgreSQL.
# Secrets come from the invoking environment or an explicit, permission-restricted
# env file outside the checkout (see .env.example). Do not store real secrets in
# the repository's auto-loaded .env.
#
#   docker compose --env-file /secure/path/hausverwaltung.env \
#     -f docker-compose.prod.yml up -d --build
#
# On a CI-driven host, set APP_IMAGE to the pushed registry image and:
#   docker compose -f docker-compose.prod.yml pull && docker compose -f docker-compose.prod.yml up -d
#
# Put a TLS-terminating reverse proxy (Caddy/Traefik/nginx) in front; the app
# serves plain HTTP on :8000 and sets a Secure session cookie (HTTPS required).

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: hausverwaltung
      POSTGRES_USER: app_migrator
      POSTGRES_PASSWORD: ${MIGRATOR_PASSWORD:?set MIGRATOR_PASSWORD in the protected env file or invoking environment}
      APP_RW_PASSWORD: ${APP_RW_PASSWORD:?set APP_RW_PASSWORD in the protected env file or invoking environment}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/db/prod-init.sh:/docker-entrypoint-initdb.d/10-app-rw.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app_migrator -d hausverwaltung"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    image: ${APP_IMAGE:-hausverwaltung:local}
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      HV_DATABASE_URL: postgresql+asyncpg://app_rw:${APP_RW_PASSWORD}@db:5432/hausverwaltung
      HV_DATABASE_URL_MIGRATOR: postgresql+asyncpg://app_migrator:${MIGRATOR_PASSWORD}@db:5432/hausverwaltung
      HV_DATABASE_URL_SYNC: postgresql://app_migrator:${MIGRATOR_PASSWORD}@db:5432/hausverwaltung
      HV_SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in the protected env file or invoking environment}
      HV_SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-true}
      HV_DOCUMENT_STORAGE_ROOT: /data/documents
      HV_DATA_REGION: ${HV_DATA_REGION:-EU}
      # The API needs the server-only key only for optional cited Q&A.  Browse
      # and lexical search are deterministic and remain available without it.
      HV_OPENAI_API_KEY: ${HV_OPENAI_API_KEY:-}
      HV_DECLARATION_IMPORT_ENABLED: ${HV_DECLARATION_IMPORT_ENABLED:-true}
      HV_DECLARATION_MAX_PDF_BYTES: ${HV_DECLARATION_MAX_PDF_BYTES:-26214400}
      HV_DECLARATION_MAX_DOCUMENTS: ${HV_DECLARATION_MAX_DOCUMENTS:-10}
      HV_DECLARATION_MAX_PAGES: ${HV_DECLARATION_MAX_PAGES:-500}
      HV_DECLARATION_OCR_DPI: ${HV_DECLARATION_OCR_DPI:-180}
      HV_DECLARATION_OCR_TIMEOUT_SECONDS: ${HV_DECLARATION_OCR_TIMEOUT_SECONDS:-30}
      HV_DECLARATION_TEXT_MIN_CHARS: ${HV_DECLARATION_TEXT_MIN_CHARS:-40}
      HV_DECLARATION_OCR_MAX_PIXELS_PER_PAGE: ${HV_DECLARATION_OCR_MAX_PIXELS_PER_PAGE:-20000000}
      HV_DECLARATION_OCR_MAX_TEMP_BYTES: ${HV_DECLARATION_OCR_MAX_TEMP_BYTES:-268435456}
      HV_DECLARATION_OCR_MAX_PAGES_PER_IMPORT: ${HV_DECLARATION_OCR_MAX_PAGES_PER_IMPORT:-200}
      HV_DECLARATION_OCR_MAX_PIXELS_PER_IMPORT: ${HV_DECLARATION_OCR_MAX_PIXELS_PER_IMPORT:-400000000}
      HV_DECLARATION_PREFLIGHT_DEADLINE_SECONDS: ${HV_DECLARATION_PREFLIGHT_DEADLINE_SECONDS:-600}
      HV_DECLARATION_PRIMARY_MODEL: ${HV_DECLARATION_PRIMARY_MODEL:-gpt-5.6-luna}
      HV_DECLARATION_ESCALATION_MODEL: ${HV_DECLARATION_ESCALATION_MODEL:-gpt-5.4-mini}
      HV_DECLARATION_PROMPT_VERSION: ${HV_DECLARATION_PROMPT_VERSION:-declaration-v1}
      HV_DECLARATION_SCHEMA_VERSION: ${HV_DECLARATION_SCHEMA_VERSION:-1}
      HV_DECLARATION_HARNESS_VERSION: ${HV_DECLARATION_HARNESS_VERSION:-1}
      HV_DECLARATION_PROVIDER_TIMEOUT_SECONDS: ${HV_DECLARATION_PROVIDER_TIMEOUT_SECONDS:-60}
      HV_DECLARATION_MAX_COST_USD: ${HV_DECLARATION_MAX_COST_USD:-1.00}
      HV_DECLARATION_MAX_RECHECK_PAGES: ${HV_DECLARATION_MAX_RECHECK_PAGES:-12}
      HV_DECLARATION_MAX_RECHECK_CALLS: ${HV_DECLARATION_MAX_RECHECK_CALLS:-2}
      HV_DECLARATION_PROVIDER_BATCH_PAGES: ${HV_DECLARATION_PROVIDER_BATCH_PAGES:-20}
      HV_DECLARATION_PROVIDER_BATCH_CHARS: ${HV_DECLARATION_PROVIDER_BATCH_CHARS:-80000}
      HV_DECLARATION_MAX_INPUT_TOKENS: ${HV_DECLARATION_MAX_INPUT_TOKENS:-500000}
      HV_DECLARATION_MAX_OUTPUT_TOKENS: ${HV_DECLARATION_MAX_OUTPUT_TOKENS:-60000}
      HV_DECLARATION_PROVIDER_MAX_OUTPUT_TOKENS_PER_CALL: ${HV_DECLARATION_PROVIDER_MAX_OUTPUT_TOKENS_PER_CALL:-12000}
      HV_DECLARATION_MAX_CANDIDATES: ${HV_DECLARATION_MAX_CANDIDATES:-5000}
      HV_DECLARATION_PRIMARY_INPUT_USD_PER_MILLION: ${HV_DECLARATION_PRIMARY_INPUT_USD_PER_MILLION:-0.20}
      HV_DECLARATION_PRIMARY_OUTPUT_USD_PER_MILLION: ${HV_DECLARATION_PRIMARY_OUTPUT_USD_PER_MILLION:-1.20}
      HV_DECLARATION_ESCALATION_INPUT_USD_PER_MILLION: ${HV_DECLARATION_ESCALATION_INPUT_USD_PER_MILLION:-0.75}
      HV_DECLARATION_ESCALATION_OUTPUT_USD_PER_MILLION: ${HV_DECLARATION_ESCALATION_OUTPUT_USD_PER_MILLION:-4.50}
      HV_DECLARATION_WORKER_ID: ${HV_DECLARATION_WORKER_ID:-declaration-worker}
      HV_DECLARATION_WORKER_POLL_SECONDS: ${HV_DECLARATION_WORKER_POLL_SECONDS:-2.0}
      HV_DECLARATION_LEASE_SECONDS: ${HV_DECLARATION_LEASE_SECONDS:-120}
      HV_DECLARATION_MAX_ATTEMPTS: ${HV_DECLARATION_MAX_ATTEMPTS:-3}
      HV_DECLARATION_SEARCH_TRIGRAM_THRESHOLD: ${HV_DECLARATION_SEARCH_TRIGRAM_THRESHOLD:-0.25}
      HV_DECLARATION_QA_ENABLED: ${HV_DECLARATION_QA_ENABLED:-false}
      HV_DECLARATION_QA_MODEL: ${HV_DECLARATION_QA_MODEL:-gpt-5.6-luna}
      HV_DECLARATION_QA_TIMEOUT_SECONDS: ${HV_DECLARATION_QA_TIMEOUT_SECONDS:-30}
      HV_DECLARATION_QA_MAX_HITS: ${HV_DECLARATION_QA_MAX_HITS:-20}
      HV_DECLARATION_QA_MAX_INPUT_TOKENS: ${HV_DECLARATION_QA_MAX_INPUT_TOKENS:-20000}
      HV_DECLARATION_QA_MAX_OUTPUT_TOKENS: ${HV_DECLARATION_QA_MAX_OUTPUT_TOKENS:-1000}
      HV_DECLARATION_QA_MAX_COST_USD: ${HV_DECLARATION_QA_MAX_COST_USD:-0.05}
      HV_DECLARATION_QA_BUDGET_WINDOW_MINUTES: ${HV_DECLARATION_QA_BUDGET_WINDOW_MINUTES:-60}
      HV_DECLARATION_QA_RESERVATION_SECONDS: ${HV_DECLARATION_QA_RESERVATION_SECONDS:-120}
      HV_DECLARATION_QA_MAX_CONCURRENCY: ${HV_DECLARATION_QA_MAX_CONCURRENCY:-4}
      HV_DECLARATION_QA_INPUT_USD_PER_MILLION: ${HV_DECLARATION_QA_INPUT_USD_PER_MILLION:-0.20}
      HV_DECLARATION_QA_OUTPUT_USD_PER_MILLION: ${HV_DECLARATION_QA_OUTPUT_USD_PER_MILLION:-1.20}
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
    volumes:
      - documents:/data/documents
    ports:
      - "${APP_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3).read()"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 10s

  worker:
    image: ${APP_IMAGE:-hausverwaltung:local}
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      app:
        condition: service_healthy
    environment:
      HV_DATABASE_URL: postgresql+asyncpg://app_rw:${APP_RW_PASSWORD}@db:5432/hausverwaltung
      HV_OPENAI_API_KEY: ${HV_OPENAI_API_KEY:-}
      HV_DOCUMENT_STORAGE_ROOT: /data/documents
      HV_DATA_REGION: ${HV_DATA_REGION:-EU}
      HV_DECLARATION_IMPORT_ENABLED: ${HV_DECLARATION_IMPORT_ENABLED:-true}
      HV_DECLARATION_MAX_PDF_BYTES: ${HV_DECLARATION_MAX_PDF_BYTES:-26214400}
      HV_DECLARATION_MAX_DOCUMENTS: ${HV_DECLARATION_MAX_DOCUMENTS:-10}
      HV_DECLARATION_MAX_PAGES: ${HV_DECLARATION_MAX_PAGES:-500}
      HV_DECLARATION_OCR_DPI: ${HV_DECLARATION_OCR_DPI:-180}
      HV_DECLARATION_OCR_TIMEOUT_SECONDS: ${HV_DECLARATION_OCR_TIMEOUT_SECONDS:-30}
      HV_DECLARATION_TEXT_MIN_CHARS: ${HV_DECLARATION_TEXT_MIN_CHARS:-40}
      HV_DECLARATION_OCR_MAX_PIXELS_PER_PAGE: ${HV_DECLARATION_OCR_MAX_PIXELS_PER_PAGE:-20000000}
      HV_DECLARATION_OCR_MAX_TEMP_BYTES: ${HV_DECLARATION_OCR_MAX_TEMP_BYTES:-268435456}
      HV_DECLARATION_OCR_MAX_PAGES_PER_IMPORT: ${HV_DECLARATION_OCR_MAX_PAGES_PER_IMPORT:-200}
      HV_DECLARATION_OCR_MAX_PIXELS_PER_IMPORT: ${HV_DECLARATION_OCR_MAX_PIXELS_PER_IMPORT:-400000000}
      HV_DECLARATION_PREFLIGHT_DEADLINE_SECONDS: ${HV_DECLARATION_PREFLIGHT_DEADLINE_SECONDS:-600}
      HV_DECLARATION_PRIMARY_MODEL: ${HV_DECLARATION_PRIMARY_MODEL:-gpt-5.6-luna}
      HV_DECLARATION_ESCALATION_MODEL: ${HV_DECLARATION_ESCALATION_MODEL:-gpt-5.4-mini}
      HV_DECLARATION_PROMPT_VERSION: ${HV_DECLARATION_PROMPT_VERSION:-declaration-v1}
      HV_DECLARATION_SCHEMA_VERSION: ${HV_DECLARATION_SCHEMA_VERSION:-1}
      HV_DECLARATION_HARNESS_VERSION: ${HV_DECLARATION_HARNESS_VERSION:-1}
      HV_DECLARATION_PROVIDER_TIMEOUT_SECONDS: ${HV_DECLARATION_PROVIDER_TIMEOUT_SECONDS:-60}
      HV_DECLARATION_MAX_COST_USD: ${HV_DECLARATION_MAX_COST_USD:-1.00}
      HV_DECLARATION_MAX_RECHECK_PAGES: ${HV_DECLARATION_MAX_RECHECK_PAGES:-12}
      HV_DECLARATION_MAX_RECHECK_CALLS: ${HV_DECLARATION_MAX_RECHECK_CALLS:-2}
      HV_DECLARATION_PROVIDER_BATCH_PAGES: ${HV_DECLARATION_PROVIDER_BATCH_PAGES:-20}
      HV_DECLARATION_PROVIDER_BATCH_CHARS: ${HV_DECLARATION_PROVIDER_BATCH_CHARS:-80000}
      HV_DECLARATION_MAX_INPUT_TOKENS: ${HV_DECLARATION_MAX_INPUT_TOKENS:-500000}
      HV_DECLARATION_MAX_OUTPUT_TOKENS: ${HV_DECLARATION_MAX_OUTPUT_TOKENS:-60000}
      HV_DECLARATION_PROVIDER_MAX_OUTPUT_TOKENS_PER_CALL: ${HV_DECLARATION_PROVIDER_MAX_OUTPUT_TOKENS_PER_CALL:-12000}
      HV_DECLARATION_MAX_CANDIDATES: ${HV_DECLARATION_MAX_CANDIDATES:-5000}
      HV_DECLARATION_PRIMARY_INPUT_USD_PER_MILLION: ${HV_DECLARATION_PRIMARY_INPUT_USD_PER_MILLION:-0.20}
      HV_DECLARATION_PRIMARY_OUTPUT_USD_PER_MILLION: ${HV_DECLARATION_PRIMARY_OUTPUT_USD_PER_MILLION:-1.20}
      HV_DECLARATION_ESCALATION_INPUT_USD_PER_MILLION: ${HV_DECLARATION_ESCALATION_INPUT_USD_PER_MILLION:-0.75}
      HV_DECLARATION_ESCALATION_OUTPUT_USD_PER_MILLION: ${HV_DECLARATION_ESCALATION_OUTPUT_USD_PER_MILLION:-4.50}
      HV_DECLARATION_WORKER_ID: ${HV_DECLARATION_WORKER_ID:-declaration-worker}
      HV_DECLARATION_WORKER_POLL_SECONDS: ${HV_DECLARATION_WORKER_POLL_SECONDS:-2.0}
      HV_DECLARATION_LEASE_SECONDS: ${HV_DECLARATION_LEASE_SECONDS:-120}
      HV_DECLARATION_MAX_ATTEMPTS: ${HV_DECLARATION_MAX_ATTEMPTS:-3}
    volumes:
      - documents:/data/documents
    entrypoint: ["/usr/local/bin/worker-entrypoint.sh"]
    healthcheck:
      test: ["CMD", "python", "-m", "app.workers.declaration_import", "--healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  pgdata:
  documents:
