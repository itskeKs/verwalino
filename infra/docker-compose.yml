# docker-compose for development / test database
# Provides PostgreSQL with the two-role setup required for RLS.
#
# Usage:
#   docker-compose -f infra/docker-compose.yml up -d
#   # To run tests:
#   cd backend && pytest

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: hausverwaltung
      POSTGRES_USER: app_migrator          # Owner role (DDL, bypasses RLS by ownership)
      POSTGRES_PASSWORD: migrator_secret   # Dev-only; never use in production
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../infra/db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app_migrator -d hausverwaltung"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
